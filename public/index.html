<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b7a75" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" />
  <title>Chat Démo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --main: #0b7a75; --bg: #f0f2f5; --me: #d9fdd3; --other: #fff; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: #111;
      display: flex; flex-direction: column;
    }
    header {
      background: var(--main); color: #fff;
      padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    header h1 { font-size: 1.05rem; }
    #sub { font-size: .75rem; opacity: .85; }
    .right { display: flex; align-items: center; gap: 8px; }
    #status { font-size: .72rem; padding: 3px 8px; border-radius: 12px; background: #c0392b; }
    #status.ok { background: #27ae60; }
    #notifBtn {
      border: 1px solid #fff; background: transparent; color: #fff;
      border-radius: 8px; padding: 5px 8px; font-size: .75rem; cursor: pointer;
    }
    #notifBtn:disabled { opacity: .6; cursor: default; }

    /* écran de connexion */
    #login {
      margin: auto; width: min(90%, 360px); background: #fff; padding: 24px;
      border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.12); text-align: center;
    }
    #login h2 { margin-bottom: 14px; color: var(--main); }
    #login input, #login button { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px; }
    #login input { border: 1px solid #ccc; margin-bottom: 10px; }
    #login button { border: 0; background: var(--main); color: #fff; cursor: pointer; }

    /* chat */
    #chat { display: none; flex: 1; flex-direction: column; min-height: 0; }
    #messages {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .msg { max-width: 80%; padding: 7px 10px; border-radius: 10px; background: var(--other);
           box-shadow: 0 1px 1px rgba(0,0,0,.1); word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.me { align-self: flex-end; background: var(--me); }
    .msg .who { font-size: .72rem; font-weight: 600; color: var(--main); margin-bottom: 2px; }
    .msg .time { font-size: .65rem; color: #777; text-align: right; margin-top: 2px; }
    .system { align-self: center; font-size: .72rem; color: #555; background: #e2e8ea;
              padding: 3px 10px; border-radius: 10px; }
    #typing { height: 18px; padding: 0 14px; font-size: .75rem; color: #666; font-style: italic; }
    form {
      display: flex; gap: 8px; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
      background: #fff; border-top: 1px solid #ddd;
    }
    form input { flex: 1; padding: 11px 14px; font-size: 1rem; border: 1px solid #ccc; border-radius: 22px; }
    form button { border: 0; background: var(--main); color: #fff; border-radius: 22px; padding: 0 18px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>💬 Chat Démo</h1>
      <div id="sub">Hors ligne</div>
    </div>
    <div class="right">
      <button id="notifBtn" type="button" hidden>🔔 Notifications</button>
      <span id="status">déconnecté</span>
    </div>
  </header>

  <!-- Écran 1 : choix du pseudo -->
  <div id="login">
    <h2>Rejoindre le chat</h2>
    <input id="nameInput" placeholder="Votre pseudo" maxlength="20" autocomplete="off" />
    <button id="joinBtn" type="button">Entrer</button>
  </div>

  <!-- Écran 2 : conversation -->
  <div id="chat">
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="form">
      <input id="text" placeholder="Écrire un message…" autocomplete="off" maxlength="500" />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ---------------- Éléments ----------------
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status"), subEl = $("sub"), messagesEl = $("messages"),
          typingEl = $("typing"), notifBtn = $("notifBtn");
    let myName = "";
    try { myName = sessionStorage.getItem("chat-name") || ""; } catch (e) {}

    // ---------------- 1. WebSocket (Socket.IO) ----------------
    // Reconnexion automatique intégrée ; les messages émis hors ligne sont mis en file d'attente.
    const socket = io();

    socket.on("connect", () => {
      statusEl.textContent = "en ligne";
      statusEl.classList.add("ok");
      if (myName) socket.emit("join", myName); // se ré-identifier après une reconnexion
    });
    socket.on("disconnect", () => {
      statusEl.textContent = "reconnexion…";
      statusEl.classList.remove("ok");
    });

    socket.on("history", (list) => {
      messagesEl.innerHTML = "";
      list.forEach(addMessage);
    });
    socket.on("message", addMessage);
    socket.on("system", (t) => {
      const d = document.createElement("div");
      d.className = "system";
      d.textContent = t;                      // textContent : protège contre le XSS
      messagesEl.appendChild(d);
      scrollDown();
    });
    socket.on("users", (list) => { subEl.textContent = `${list.length} en ligne : ${list.join(", ")}`; });

    let typingTimer;
    socket.on("typing", (who) => {
      typingEl.textContent = `${who} est en train d'écrire…`;
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => (typingEl.textContent = ""), 1500);
    });

    function addMessage(m) {
      const box = document.createElement("div");
      box.className = "msg" + (m.user === myName ? " me" : "");
      if (m.user !== myName) {
        const w = document.createElement("div"); w.className = "who"; w.textContent = m.user;
        box.appendChild(w);
      }
      const t = document.createElement("div"); t.textContent = m.text;   // jamais innerHTML
      const h = document.createElement("div"); h.className = "time";
      h.textContent = new Date(m.time).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      box.append(t, h);
      messagesEl.appendChild(box);
      scrollDown();
    }
    function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    // ---------------- 2. Interface ----------------
    function enterChat() {
      $("login").style.display = "none";
      $("chat").style.display = "flex";
      socket.emit("join", myName);
      setupNotifButton();
    }
    $("joinBtn").onclick = () => {
      const v = $("nameInput").value.trim();
      if (!v) return;
      myName = v;
      try { sessionStorage.setItem("chat-name", myName); } catch (e) {}
      enterChat();
    };
    $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("joinBtn").click(); });

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = $("text");
      if (!input.value.trim()) return;
      socket.emit("message", input.value);
      input.value = "";
      input.focus();
    });
    $("text").addEventListener("input", () => socket.emit("typing"));

    if (myName) { $("nameInput").value = myName; }

    // ---------------- 3. Service Worker + Push ----------------
    // Nécessite HTTPS (ou localhost)
    const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    let swReg = null;

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").then((reg) => { swReg = reg; })
        .catch((err) => console.warn("Service Worker indisponible :", err.message));
    }

    function setupNotifButton() {
      if (!pushSupported) return;       // ex. http://192.168.x.x sur mobile : pas de push
      notifBtn.hidden = false;
      if (Notification.permission === "granted") { notifBtn.disabled = true; notifBtn.textContent = "🔔 Activées"; subscribePush(); }
      if (Notification.permission === "denied") { notifBtn.disabled = true; notifBtn.textContent = "🔕 Bloquées"; }
    }

    notifBtn.onclick = async () => {
      // Étape 1 : demander la permission (doit venir d'un geste de l'utilisateur)
      const perm = await Notification.requestPermission();
      if (perm === "granted") { notifBtn.disabled = true; notifBtn.textContent = "🔔 Activées"; subscribePush(); }
    };

    async function subscribePush() {
      try {
        const reg = await navigator.serviceWorker.ready;
        // Étape 2 : récupérer la clé publique VAPID du serveur
        const { key } = await (await fetch("/vapidPublicKey")).json();
        // Étape 3 : créer l'abonnement auprès du service push du navigateur (FCM, Mozilla…)
        const sub = (await reg.pushManager.getSubscription()) ||
          (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(key) }));
        // Étape 4 : envoyer l'abonnement à notre serveur
        await fetch("/subscribe", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subscription: sub, user: myName }),
        });
      } catch (err) { console.warn("Abonnement push impossible :", err.message); }
    }

    function urlBase64ToUint8Array(b64) {
      const pad = "=".repeat((4 - (b64.length % 4)) % 4);
      const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
    }

    // Reconnexion automatique si un pseudo est déjà mémorisé
    if (myName) enterChat();
  </script>
</body>
</html>
